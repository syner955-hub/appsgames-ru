name: Auto-publish news

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Сколько статей сгенерить (по умолчанию 1)"
        required: false
        default: "1"
      dry_run:
        description: "DRY_RUN (не коммитить, только лог)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate articles
        env:
          NANO_GPT_API_KEY: ${{ secrets.NANO_GPT_API_KEY }}
          MAX_PER_RUN: ${{ github.event.inputs.count || '1' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node scripts/auto-publish.mjs

      - name: Regenerate OG previews
        if: github.event.inputs.dry_run != 'true'
        run: node scripts/generate-og.mjs

      - name: Commit and push if new articles
        id: commit
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "appsgames-bot"
          git config user.email "bot@appsgames.ru"
          if [[ -n "$(git status --porcelain)" ]]; then
            # Собираем список новых MDX до коммита (для Actions Summary и IndexNow)
            NEW_MDX=$(git status --porcelain | awk '$1=="A" || $1=="??" {print $2}' | grep -E '^src/pages/.*\.mdx$' || true)
            git add -A
            git commit -m "chore(news): auto-published $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            # Превращаем src/pages/foo/bar.mdx → https://appsgames.ru/foo/bar/
            NEW_URLS=$(echo "$NEW_MDX" | sed -E 's#^src/pages/##; s#/index\.mdx$#/#; s#\.mdx$#/#' | awk 'NF{print "https://appsgames.ru/"$0}')
            echo "urls<<EOF" >> "$GITHUB_OUTPUT"
            echo "$NEW_URLS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            # Красивый Summary с кликабельными ссылками
            {
              echo "## Новые публикации"
              echo ""
              if [[ -n "$NEW_URLS" ]]; then
                echo "$NEW_URLS" | awk 'NF{print "- ["$0"]("$0")"}'
              else
                echo "_Новых MDX не обнаружено (вероятно, только обновлённые файлы)._"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No changes to commit."
          fi

      - name: Ping IndexNow (Яндекс / Bing / Seznam / Yep)
        if: >
          github.event.inputs.dry_run != 'true' &&
          steps.commit.outputs.urls != ''
        run: |
          echo "${{ steps.commit.outputs.urls }}" | node scripts/indexnow-ping.mjs --stdin
        continue-on-error: true
