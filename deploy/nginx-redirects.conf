# ===========================================================================
# 301-редиректы с устаревших WordPress-URL на новые.
#
# Установка в FastPanel:
#   Сайты → appsgames.ru → Nginx → «Дополнительные директивы» (на уровне
#   server) → вставить строку:
#       include /var/www/appsgames_ru_usr/data/nginx-redirects.conf;
#   Сохранить. FastPanel сам перезагрузит nginx.
#
# Файл кладётся на сервер workflow'ом `.github/workflows/deploy.yml` по пути
#       /var/www/appsgames_ru_usr/data/nginx-redirects.conf
# ===========================================================================

# --- WP rabota-s-itunes → новые URL ------------------------------------
location ^~ /rabota-s-itunes/kak-zakachat-muzyku/              { return 301 /ios/kak-sdelat/skachat-muzyku-iphone/; }
location ^~ /rabota-s-itunes/sinhronizacia-s-iphone-ipad-ipod/ { return 301 /ios/kak-sdelat/sinhronizaciya-iphone-pc/; }
location ^~ /rabota-s-itunes/alternativa/                      { return 301 /obzory/alternativy-itunes/; }
location ^~ /rabota-s-itunes/kak-skinut-film-na-ipad-iphone/   { return 301 /ios/kak-sdelat/zakachat-film-na-iphone/; }
location ^~ /rabota-s-itunes/itunes-ne-vidit-iphone/           { return 301 /ios/kak-sdelat/sinhronizaciya-iphone-pc/; }
location ^~ /rabota-s-itunes/                                  { return 301 /obzory/alternativy-itunes/; }

# --- poleznoe-ios: старые длинные URL ----------------------------------
location ^~ /poleznoe-ios/kak-zakachat-film-na-ipad-iphone/    { return 301 /ios/kak-sdelat/zakachat-film-na-iphone/; }
location ^~ /poleznoe-ios/chem-otlichaetsya-ajjfon-5-ot-5s/    { return 301 /ios/; }

# --- poleznoe-dlya-android ---------------------------------------------
location ^~ /poleznoe-dlya-android/sinhronizacia-s-pk/         { return 301 /android/kak-sdelat/sinhronizaciya-android-pc/; }

# --- raznoe ------------------------------------------------------------
location ^~ /raznoe/ne-vklyuchaetsya-ipad/                     { return 301 /ios/kak-sdelat/ipad-ne-vklyuchaetsya/; }
location ^~ /raznoe/skolko-stoit-zamena-ehkrana/               { return 301 /android/kak-sdelat/zamena-ehkrana-smartfona/; }
location ^~ /raznoe/rozovyjj-iphone-7/                         { return 301 /ios/; }
location ^~ /raznoe/                                           { return 301 /; }

# --- WP архивы по годам → главная --------------------------------------
location ^~ /2013/ { return 301 /; }
location ^~ /2014/ { return 301 /; }
location ^~ /2015/ { return 301 /; }
location ^~ /2016/ { return 301 /; }
location ^~ /2017/ { return 301 /; }
location ^~ /2018/ { return 301 /; }
location ^~ /2019/ { return 301 /; }
location ^~ /2020/ { return 301 /; }
location ^~ /2021/ { return 301 /; }
location ^~ /2022/ { return 301 /; }
location ^~ /2023/ { return 301 /; }
location ^~ /2024/ { return 301 /; }
location ^~ /2025/ { return 301 /; }

# --- WP категории → новые хабы -----------------------------------------
location ^~ /category/obzory/  { return 301 /obzory/;  }
location ^~ /category/sovety/  { return 301 /sovety/;  }
location ^~ /category/ios/     { return 301 /ios/;     }
location ^~ /category/android/ { return 301 /android/; }
location ^~ /category/         { return 301 /;         }

location ^~ /tag/     { return 301 /; }
location ^~ /author/  { return 301 /; }
location ^~ /page/    { return 301 /; }

# --- WP-фиды → главная -------------------------------------------------
location ^~ /feed/           { return 301 /; }
location ^~ /comments/feed/  { return 301 /; }
# Любой /<что-то>/feed/ — обрабатываем через regex (один location)
location ~ ^/[^/]+/feed/?$   { return 301 /; }

# --- Старые WP sitemap → новые -----------------------------------------
location = /sitemap_index.xml    { return 301 /sitemap-index.xml; }
location = /post-sitemap.xml     { return 301 /sitemap-0.xml; }
location = /page-sitemap.xml     { return 301 /sitemap-0.xml; }
location = /category-sitemap.xml { return 301 /sitemap-0.xml; }

# --- /android/casino/ → /casino/ (301, поймает nginx до Astro HTML) ------
# Критично для SEO: Astro.redirect() в SSG генерирует meta-refresh, а не HTTP 301.
# Яндекс не передаёт вес через meta-refresh → страницы выпадают из индекса.
# Настоящий 301 на уровне nginx решает проблему.
location ~ ^/android/casino/(.+?)/?$ { return 301 /casino/$1/; }

# --- WP мусор — закрываем, чтобы боты перестали долбиться --------------
location ^~ /wp-content/  { return 301 /; }
location ^~ /wp-includes/ { return 301 /; }
location ^~ /wp-admin/    { return 301 /; }
location ^~ /wp-json/     { return 301 /; }
location = /wp-login.php  { return 301 /; }
location = /wp-cron.php   { return 301 /; }
location = /xmlrpc.php    { return 301 /; }
location = /readme.html   { return 301 /; }
location = /license.txt   { return 301 /; }
